<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; color: #333; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    input, button { padding: 8px 12px; font-size: 1rem; }
    button { cursor: pointer; background-color: #008080; color: white; border: none; border-radius: 4px; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    input { flex: 1; border: 1px solid #ccc; border-radius: 4px; }
    #status { font-weight: bold; margin-bottom: 15px; color: #555; }
    ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    li { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 6px; }
    li p { margin: 4px 0; }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>
  
  <div class="controls">
    <button id="load-users">Load Users</button>
    <div>
      <label for="filter-input">Filter:</label>
      <input type="text" id="filter-input" placeholder="Type name to filter...">
    </div>
  </div>

  <p id="status">Click "Load Users" to fetch data.</p>
  <ul id="users-list"></ul>
</body>
</html>
